<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!--leaflet-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <title>mapper</title>
</head>

<body>
    <div class="row">
        <div class="col-lg-9">
            <div id="map"></div>
        </div>
        <div class="col-lg-3 bg-light">
            <div class="card m-2">
                <div class="card-body" align="center">
                    <div id="title">
                        <h4><b>Click a pin or the map.</b></h4>
                    </div>
                    <hr>
                    <small id="id">ID: </small>
                </div>
            </div>
            <div class="card m-2">
                <div class="card-body">
                    <p id="lat">Lat: </p>
                    <p id="long">Long: </p>
                    <p id="type">Type: </p>
                    <hr>
                    <form id="desc">
                        <label>Description:</label>
                        <textarea class="form-control" placeholder="No Data" rows="3" readonly></textarea>
                    </form>
                </div>
            </div>
            <div class="card m-2">
                <div class="card-body">
                    <label>Maintenance:</label>
                    
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton"
                            data-toggle="dropdown">
                            No Data
                        </button>
                        <div class="dropdown-menu">
                            <a class="dropdown-item disabled" href="#">Not Needed</a>
                            <a class="dropdown-item disabled" href="#">In Progress</a>
                            <a class="dropdown-item disabled" href="#">Needed</a>
                        </div>
                    </div>
                    <hr>
                    <form id="maintDesc">
                        <label>Maintenance Description:</label>
                        <textarea class="form-control" placeholder="No Data" rows="3" readonly></textarea>
                    </form>
                </div>
            </div>

            <div class="card m-2">
                <div class="card-body">
                    <div class="row">
                        <div class="col-6" align="center">
                            <div class="btn btn-primary w-100">Save</div>
                        </div>
                        <div class="col-6" align="center">
                            <div class="btn btn-danger w-100">Reset</div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>



    <!-- Optional JavaScript -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
        integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>

    <!-- leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">
        </script>

    <script>
        var map = L.map('map').setView([40.908, -73.788], 18);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
    </script>
    <script>
        var tempMarker;
        async function loadData() {
            try {
                let response = await fetch("api/locations");
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                let data = await response.json();

                data.forEach((location) => {
                    const marker = L.marker([location.lat, location.long]).addTo(map);
                    marker.bindPopup(location.title);
                    marker.on('click', () => {
                        if (tempMarker != undefined) {
                            tempMarker.remove();
                        }
                        document.getElementById("title").innerHTML = `<h4 id="title"><b>${location.title}<b/></h4>`;
                        document.getElementById("type").textContent = `Type: ${location.type}`;
                        document.getElementById("lat").innerHTML = `Lat: <b> ${location.lat}</b>`;
                        document.getElementById("long").innerHTML = `Long: <b> ${location.long}</b>`;
                        document.getElementById("desc").innerHTML = ` <label>Description:</label>
                        <textarea class="form-control" rows="3">${location.description}</textarea>`;
                        document.getElementById("id").textContent = `ID: ${location.locationID}`;

                    })

                })


            }
            catch (error) {
                console.error("something went wrong. ", error);
            }
        }
        loadData();

        function onMapClick(e) {
            // alert("You clicked the map at " + e.latlng);
            document.getElementById("title").innerHTML = `<h4 id="title"><b>No data</b></h4>`;
            document.getElementById("type").textContent = "Type: No Type";
            document.getElementById("lat").innerHTML = `Lat: <b> ${e.latlng.lat}</b>`;
            document.getElementById("long").innerHTML = `Long: <b> ${e.latlng.lng}</b>`
            document.getElementById("desc").innerHTML = ` <label>Description:</label>
                        <textarea class="form-control" placeholder="None" rows="3"></textarea>`;
            document.getElementById("id").textContent = "ID: None";
            if (tempMarker != undefined) {
                tempMarker.remove();
            }
            tempMarker = L.marker(e.latlng).addTo(map);
        }

        map.on('click', onMapClick);
    </script>

</body>

</html>

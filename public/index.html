<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!--leaflet-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <title>maintenance map</title>
</head>

<body>
    <div class="row">
        <div class="col-lg-9">
            <div id="map"></div>
        </div>
        <div class="col-lg-3 bg-light">
            <div class="card m-2">
                <div class="card-body" align="center">
                    <div id="title">
                        <input id="titleBox" class="form-control form-control-lg" type="text"
                            placeholder="Click a pin or the map." readonly>
                    </div>
                    <hr>
                    <small id="id">ID: </small>
                </div>
            </div>
            <div class="card m-2">
                <div class="card-body">
                    <p id="lat">Lat: </p>
                    <p id="long">Long: </p>
                    <hr>
                    <div class="row">
                        <div class="col-3 py-2">
                            <label>Type:</label>
                        </div>
                        <div class="col-9 pb-3">
                            <div id="type" class="dropdown" align="center">
                                <button class="btn btn-secondary dropdown-toggle w-75" type="button"
                                    id="dropdownMenuButton" data-toggle="dropdown">
                                    No Data
                                </button>
                                <div class="dropdown-menu">
                                    <a class="dropdown-item disabled" href="#">Station</a>
                                    <a class="dropdown-item disabled" href="#">Catenary Structure</a>
                                    <a class="dropdown-item disabled" href="#">Control Point</a>
                                    <a class="dropdown-item disabled" href="#">Bridge</a>
                                    <a class="dropdown-item disabled" href="#">Other</a>
                                </div>
                            </div>
                        </div>
                        <hr>
                        <form id="desc">
                            <label class="py-2">Description:</label>
                            <textarea id="descBox" class="form-control" placeholder="No Data" rows="3"
                                readonly></textarea>
                        </form>
                    </div>
                </div>
            </div>
            <div class="card m-2">
                <div class="card-body">
                    <div class="row">
                        <div class="col-3 py-2">
                            <label>Maintenance:</label>
                        </div>
                        <div class="col-9">
                            <div id="flag" class="dropdown" align="center">
                                <button class="btn btn-secondary dropdown-toggle w-75" type="button"
                                    id="dropdownMenuButton" data-toggle="dropdown">
                                    No Data
                                </button>
                                <div class="dropdown-menu">
                                    <a class="dropdown-item disabled" href="#">Not Needed</a>
                                    <a class="dropdown-item disabled" href="#">In Progress</a>
                                    <a class="dropdown-item disabled" href="#">Needed</a>
                                </div>
                            </div>
                        </div>
                    </div>



                    <hr>
                    <form id="maintDesc">
                        <label class="py-2">Maintenance Description:</label>
                        <textarea id="maintDescBox" class="form-control" placeholder="No Data" rows="3"
                            readonly></textarea>
                    </form>
                </div>
            </div>

            <div class="card m-2">
                <div class="card-body">
                    <div class="row">
                        <div id="save" class="col-7" align="center">
                            <button class="btn btn-primary w-100 disabled">Save</button>
                        </div>
                        <div id="delete" class="col-5" align="center">
                            <button class="btn btn-danger w-100 disabled">Delete</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <!-- Optional JavaScript -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
        integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>

    <!-- leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">
        </script>

    <!--leaflet color markers-->
    <script>
    var blueIcon = new L.Icon({
            iconUrl: './img/marker-icon-2x-blue.png',
            shadowUrl: './img/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var goldIcon = new L.Icon({
            iconUrl: './img/marker-icon-2x-gold.png',
            shadowUrl: './img/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var redIcon = new L.Icon({
            iconUrl: './img/marker-icon-2x-red.png',
            shadowUrl: './img/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var greenIcon = new L.Icon({
            iconUrl: './img/marker-icon-2x-green.png',
            shadowUrl: './img/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var orangeIcon = new L.Icon({
            iconUrl: './img/marker-icon-2x-orange.png',
            shadowUrl: './img/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var yellowIcon = new L.Icon({
            iconUrl: './img/marker-icon-2x-yellow.png',
            shadowUrl: './img/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var violetIcon = new L.Icon({
            iconUrl: './img/marker-icon-2x-violet.png',
            shadowUrl: './img/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var greyIcon = new L.Icon({
            iconUrl: './img/marker-icon-2x-grey.png',
            shadowUrl: './img/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var blackIcon = new L.Icon({
            iconUrl: './img/marker-icon-2x-black.png',
            shadowUrl: './img/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });</script>
    <script>
        var map = L.map('map').setView([40.908, -73.788], 18);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
    </script>

    <script>
        var tempMarker;
        var tempLat;
        var tempLong;
        var tempID;
        var typeState;
        var maintState;


        function typeIconColor(type, maintenanceFlag) {
            if(maintenanceFlag == "Needed"){
                return redIcon;
            }
            if(maintenanceFlag == "In Progress"){
                return goldIcon;
            }
            
            switch(type){
                case "Station":
                    return blueIcon;
                case "Control Point":
                    return greenIcon; 
                case "Catenary Structure":
                    return blackIcon;
                case "Bridge":
                    return greyIcon;
                default:
                    return violetIcon;
            }

        }

        const markerGroup = L.layerGroup().addTo(map);

        async function loadData() {
            try {
                let response = await fetch("api/locations");
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                let data = await response.json();

                markerGroup.clearLayers();

                data.forEach((location) => {
                    const marker = L.marker([location.lat, location.long], { icon: typeIconColor(location.type,location.maintenanceFlag) }).addTo(markerGroup);
                    marker.bindPopup(location.title);
                    marker.on('click', () => {
                        if (tempMarker != undefined) {
                            tempMarker.remove();
                        }
                        document.getElementById("title").innerHTML = `<input id="titleBox" class="form-control form-control-lg" type="text" value="${location.title}">`;
                        document.getElementById("type").innerHTML = ` 
                            <button class="btn btn-secondary dropdown-toggle w-75" type="button" id="dropdownMenuButton" data-toggle="dropdown">
                            ${location.type}</button>
                            <div class="dropdown-menu">
                                    <a class="dropdown-item" href="#">Station</a>
                                    <a class="dropdown-item" href="#">Catenary Structure</a>
                                    <a class="dropdown-item" href="#">Control Point</a>
                                    <a class="dropdown-item" href="#">Bridge</a>
                                    <a class="dropdown-item" href="#">Other</a>
                            </div>`;
                        typeState = location.type;
                        document.getElementById("lat").innerHTML = `Lat: <b> ${location.lat}</b>`;
                        document.getElementById("long").innerHTML = `Long: <b> ${location.long}</b>`;
                        tempLat = location.lat;
                        tempLong = location.long;
                        document.getElementById("desc").innerHTML = ` <label>Description:</label>
                        <textarea id = "descBox" class="form-control" rows="3">${location.description}</textarea>`;
                        document.getElementById("id").textContent = `ID: ${location.locationID}`;
                        tempID = location.locationID;
                        document.getElementById("flag").innerHTML = `
                        <button class="btn btn-secondary dropdown-toggle w-75" type="button" id="dropdownMenuButton" data-toggle="dropdown">
                            ${location.maintenanceFlag}</button>
                            <div class="dropdown-menu">
                                <a class="dropdown-item" href="#">Not Needed</a>
                                <a class="dropdown-item" href="#">In Progress</a>
                                <a class="dropdown-item" href="#">Needed</a>
                            </div>`
                        maintState = location.maintenanceFlag;
                        document.getElementById("maintDesc").innerHTML = `
                            <label class="py-2">Maintenance Description:</label>
                            <textarea id = "maintDescBox" class="form-control" placeholder="" rows="3">${location.maintenanceDescription}</textarea>`
                        document.getElementById("delete").innerHTML = `<button class="btn btn-danger w-100">Delete</button>`
                    })


                })


            }
            catch (error) {
                console.error("something went wrong. ", error);
            }
        }
        loadData();


        function onMapClick(e) {
            // alert("You clicked the map at " + e.latlng);
            document.getElementById("title").innerHTML = `<input id="titleBox" class="form-control form-control-lg" type="text" placeholder="No Data">`;
            document.getElementById("type").innerHTML = ` 
                            <button class="btn btn-secondary dropdown-toggle w-75" type="button" id="dropdownMenuButton" data-toggle="dropdown">
                            No Data</button>
                            <div class="dropdown-menu">
                                    <a class="dropdown-item" href="#">Station</a>
                                    <a class="dropdown-item" href="#">Catenary Structure</a>
                                    <a class="dropdown-item" href="#">Control Point</a>
                                    <a class="dropdown-item" href="#">Bridge</a>
                                    <a class="dropdown-item" href="#">Other</a>
                            </div>`;
            document.getElementById("lat").innerHTML = `Lat: <b> ${e.latlng.lat}</b>`;
            document.getElementById("long").innerHTML = `Long: <b> ${e.latlng.lng}</b>`
            tempLat = e.latlng.lat;
            tempLong = e.latlng.lng;
            tempID = 0;
            document.getElementById("desc").innerHTML = ` <label>Description:</label>
                        <textarea id = "descBox" class= "form-control" placeholder="None" rows="3"></textarea>`;
            document.getElementById("id").textContent = "ID: None";
            document.getElementById("flag").innerHTML = `
                        <button class="btn btn-secondary dropdown-toggle w-75" type="button" id="dropdownMenuButton" data-toggle="dropdown">No Data</button>
                            <div class="dropdown-menu">
                                <a class="dropdown-item" href="#">Not Needed</a>
                                <a class="dropdown-item" href="#">In Progress</a>
                                <a class="dropdown-item" href="#">Needed</a>
                            </div>`
            maintState = "No Data";
            typeState = "Other";
            document.getElementById("maintDesc").innerHTML = `
                            <label class="py-2">Maintenance Description:</label>
                            <textarea id = "maintDescBox" class="form-control" placeholder="No Data" rows="3"></textarea>`
            document.getElementById("delete").innerHTML = `<button class="btn btn-danger w-100 disabled">Delete</button>`

            if (tempMarker != undefined) {
                tempMarker.remove();
            }
            tempMarker = L.marker(e.latlng, { icon: greenIcon }).addTo(map);
        }

        function onChange() {
            document.getElementById("save").innerHTML = `<button class="btn btn-primary w-100">Save</button>`;
        }


        function updateDropdown(containerId, onSelect) {
            const dropdown = document.getElementById(containerId);

            dropdown.addEventListener('click', (event) => {
                if (dropdown.disabled || dropdown.classList.contains('disabled')) {
                    event.preventDefault();
                    return;
                }
                const option = event.target.closest('.dropdown-item');
                if (option == null || dropdown.contains(option) == false) {
                    event.preventDefault();
                    return;
                }

                const selectedValue = option.textContent.trim();
                dropdown.querySelector('.dropdown-toggle').textContent = selectedValue;
                onSelect(selectedValue);
                onChange();
            })
        }

        updateDropdown('type', (value) => {
            typeState = value;
        });
        updateDropdown('flag', (value) => {
            maintState = value;
        });

        document.addEventListener("input", (event) => {
            if (event.target.matches("input, textarea")) {
                onChange();
            }
        });

        map.on('click', onMapClick);

        // this is the most of the ai use for this project, i really have no clue how this part works and had to use it for heavy guidance for the saving/deletion of db entries
        async function onSave(e) {
            const isNew = tempID === undefined || tempID === 0;

            const response = await fetch(
                isNew ? '/api/locations' : `/api/locations/${tempID}`,
                {
                    method: isNew ? 'POST' : 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: document.getElementById('titleBox').value,
                        type: typeState,
                        lat: tempLat,
                        long: tempLong,
                        description: document.getElementById('descBox').value,
                        maintenanceFlag: maintState,
                        maintenanceDescription: document.getElementById('maintDescBox').value
                    })
                }
            );

            if (!response.ok) {
                const details = await response.text();
                throw new Error(`Save failed: ${response.status} ${details}`);
            }
            loadData();
        }

        save.addEventListener('click', function (event) {
            if (this.disabled || this.classList.contains('disabled')) {
                event.preventDefault();
                return;
            }
            onSave(event);
        });

        document.getElementById('delete').addEventListener('click', async (event) => {
            if (!event.target.closest('button') || tempID == null || tempID === 0) return;

            if (!confirm('Delete this location?')) return;

            const response = await fetch(`/api/locations/${tempID}`, {
                method: 'DELETE'
            });

            if (!response.ok) {
                const details = await response.text();
                console.error(`Delete failed: ${response.status}`, details);
                return;
            }

            loadData();
        });


    </script>

</body>

</html>

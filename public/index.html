<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!--leaflet-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <title>mapper</title>
</head>

<body>
    <div class="row">
        <div class="col-md-9">
            <div id="map"></div>
        </div>
        <div class="col-md-3 bg-light">
            <div class="card m-1">
                <div class="card-body" align="center">
                    <h5 id="title">Click a pin to see details.</h5>

                </div>
            </div>
            <div class="card m-2">
                <div class="card-body">
                    <h6 id="type">Type: </h6>
                    <h6 id="lat">Lat: </h6>
                    <h6 id="long">Long: </h6>
                    <h6 id="desc">Description: </h6>
                    <h6 id="id">ID: </h6>
                </div>
            </div>
        </div>
    </div>



    <!-- Optional JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous">
        </script>
    <!-- leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        var map = L.map('map').setView([40.908, -73.788], 18);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
    </script>
    <script>
        async function loadData() {
            try {
                let response = await fetch("api/locations");
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                let data = await response.json();

                data.forEach((location) => {
                    const marker = L.marker([location.lat, location.long]).addTo(map);
                    marker.bindPopup(location.title);
                    marker.on('click',() => {
                         document.getElementById("title").textContent = location.title;
                        document.getElementById("type").textContent = `Type: ${location.type}`;
                        document.getElementById("lat").textContent = `Lat: ${location.lat}`;
                        document.getElementById("long").textContent = `Long: ${location.long}`;;
                        document.getElementById("desc").textContent = `Description: ${location.description}`;;
                        document.getElementById("id").textContent = `ID: ${location.locationID}`;
                    })
                   
                })


            }
            catch (error) {
                console.error("something went wrong, ", error);
            }
        }
        loadData();
    </script>

</body>

</html>
